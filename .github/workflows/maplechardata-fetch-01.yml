name: group 1

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

concurrency:
  group: maplechardata-r2
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # All config below is read from Secrets on Environment "prod" (Settings → Environments → prod → Environment secrets).
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Maplestory/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Maplestory/requirements.txt

      - name: Run MapleStory data script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_UPLOAD_DAILY_NAME: ${{ secrets.R2_UPLOAD_DAILY_NAME }}
          R2_UPLOAD_WEEK_NAME: ${{ secrets.R2_UPLOAD_WEEK_NAME }}
          R2_UPLOAD_MONTH_NAME: ${{ secrets.R2_UPLOAD_MONTH_NAME }}
          MAPLE_RANKING_API_URL: ${{ secrets.MAPLE_RANKING_API_URL }}
          MAPLE_REBOOT_INDEX: ${{ secrets.MAPLE_REBOOT_INDEX }}
          MY_CHARACTERS: ${{ secrets.MY_CHARACTERS_GROUP_1 }}
          MAPLE_JOB_LABEL: '1'
        run: python Maplestory/maplechardata.py

      - name: Error notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: console.log('Workflow failed - check logs');
